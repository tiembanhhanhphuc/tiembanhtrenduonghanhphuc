<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sweet Cake Shop</title>

<style>

body{
font-family:Arial;
margin:0;
background:#fff6f6;
}

header{

background:#ff7fa8;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;

}

h1{

margin:0;

}

.cart{

font-size:20px;
font-weight:bold;

}

.container{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:30px;

}

.card{

background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
transition:0.3s;

}

.card:hover{

transform:translateY(-8px);

}

img{

width:100%;
height:220px;
object-fit:cover;

}

.info{

padding:18px;

}

.price{

font-size:22px;
font-weight:bold;
color:#ff4b7d;

}

button{

width:100%;
padding:12px;
border:none;
background:#ff7fa8;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#ff5f93;

}

</style>

</head>

<body>

<header>

<h1>Tiệm Bánh Trên Đường Hạnh Phúc</h1>

<div class="cart">

🛒 <span id="cart">0</span>

</div>

</header>

<div class="container" id="products"></div>

<script>

const cakes=[

{

name:"Cookie Crinkle Socola",

price:"85.000 VNĐ",

img:"https://images.unsplash.com/photo-1499636136210-6f4ee915583e"

},

{

name:"Cookie Crinkle Red Velvet",

price:"90.000 VNĐ",

img:"https://images.unsplash.com/photo-1551024506-0bccd828d307"

},

{

name:"Cookie Crinkle Truyền Thống",

price:"80.000 VNĐ",

img:"https://images.unsplash.com/photo-1499636136210-6f4ee915583e"

},

{

name:"Brownie",

price:"95.000 VNĐ",

img:"https://images.unsplash.com/photo-1606313564200-e75d5e30476c"

},

{

name:"Tiramisu",

price:"180.000 VNĐ",

img:"https://images.unsplash.com/photo-1571877227200-a0d98ea607e9"

}

]

let count=0;

function addCart(){

count++;

document.getElementById("cart").innerText=count;

}

const product=document.getElementById("products");

cakes.forEach(cake=>{

product.innerHTML+=`

<div class="card">

<img src="${cake.img}">

<div class="info">

<h3>${cake.name}</h3>

<div class="price">

${cake.price}

</div>

<br>

<button onclick="addCart()">

Thêm vào giỏ

</button>

</div>

</div>

`;

})

</script>

</body>

</html>
