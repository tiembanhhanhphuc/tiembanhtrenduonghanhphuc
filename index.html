<!DOCTYPE html>
<html>
<head>
<title>Sweet Cake Shop</title>
<style>
body{
font-family:Arial;
text-align:center;
background:#fff3f3;
}

.container{
display:flex;
justify-content:center;
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

button{
background:pink;
border:none;
padding:10px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>🍰 Sweet Cake Shop</h1>

<div class="container">

<div class="card">
<h3>Tiramisu</h3>
<p>180.000 VNĐ</p>
<button>Mua ngay</button>
</div>

<div class="card">
<h3>Matcha Cake</h3>
<p>150.000 VNĐ</p>
<button>Mua ngay</button>
</div>

<div class="card">
<h3>Red Velvet</h3>
<p>220.000 VNĐ</p>
<button>Mua ngay</button>
</div>

</div>

</body>
</html>
