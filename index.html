<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tiệm Bánh Hạnh Phúc</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:Arial,sans-serif;
background:linear-gradient(
135deg,
#FFF5F5,
#FFE8D6
);

}

header{

background:#FF8FAB;
padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

color:white;

position:sticky;

top:0;

}

.logo{

font-size:32px;
font-weight:bold;

}

.cartArea{

display:flex;
gap:10px;

}

button{

border:none;
cursor:pointer;

}

.cartBtn{

background:white;

padding:10px 15px;

border-radius:10px;

font-weight:bold;

}

.container{

padding:30px;

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(250px,1fr)
);

gap:25px;

}

.card{

background:white;

border-radius:18px;

overflow:hidden;

box-shadow:

0 4px 15px

rgba(0,0,0,0.15);

transition:.3s;

}

.card:hover{

transform:

translateY(-5px);

}

.card img{

width:100%;

height:220px;

object-fit:cover;

}

.info{

padding:18px;

}

.price{

font-size:22px;

color:#E63946;

font-weight:bold;

margin:10px 0;

}

.buy{

background:#FF8FAB;

width:100%;

padding:12px;

color:white;

border-radius:8px;

font-size:16px;

}

.buy:hover{

background:#FF5D8F;

}

.delivery{

background:white;

margin:30px;

padding:25px;

border-radius:18px;

}

.delivery h2{

margin-bottom:15px;

}

input,textarea{

width:100%;

padding:12px;

margin:10px 0;

border:

1px solid #ccc;

border-radius:8px;

}

.order{

background:#28A745;

color:white;

padding:12px;

width:100%;

border-radius:10px;

font-size:16px;

}

footer{

background:#FF8FAB;

padding:20px;

text-align:center;

color:white;

margin-top:30px;

}

</style>

</head>

<body>

<header>

<div class="logo">

🍰 Tiệm Bánh Hạnh Phúc

</div>

<div class="cartArea">

<button
class="cartBtn"
onclick="viewCart()"
>

🛒 Xem giỏ
(<span id="count">0</span>)

</button>

<button
class="cartBtn"
onclick="clearCart()"
>

Xóa giỏ

</button>

</div>

</header>

<div
class="container"
id="products"
>

</div>

<div class="delivery">

<h2>

🚚 Thông tin giao hàng

</h2>

<input
id="name"
placeholder="Họ tên"
>

<input
id="phone"
placeholder="Số điện thoại"
>

<textarea
id="address"
placeholder="Địa chỉ giao hàng nội thành Đà Nẵng"
></textarea>

<button
class="order"
onclick="checkout()"
>

Đặt bánh

</button>

</div>

<footer>

📍 Tiệm Bánh Hạnh Phúc

<br><br>

Đà Nẵng

<br>

🚚 Chỉ giao nội thành Đà Nẵng

</footer>

<script>

const cakes=[

{

name:

"Cookie Crinkle Socola",

price:85000,

img:

"https://YOUR_LINK_SOCO"

},

{

name:

"Cookie Crinkle Red Velvet",

price:90000,

img:

"https://YOUR_LINK_REDVELVET"

},

{

name:

"Cookie Crinkle Truyền Thống",

price:80000,

img:

"https://YOUR_LINK_TRUYENTHONG"

},

{

name:

"Brownie",

price:95000,

img:

"https://YOUR_LINK_BROWNIE"

}

]

const products=

document
.getElementById(
"products"
)

let cart=[]

cakes.forEach(

cake=>{

products.innerHTML+=`

<div class="card">

<img
src="${cake.img}"
>

<div class="info">

<h2>

${cake.name}

</h2>

<div class="price">

${cake.price.toLocaleString()}
VNĐ

</div>

<button

class="buy"

onclick=

"addCart(

'${cake.name}',

${cake.price}

)"

>

Thêm vào giỏ

</button>

</div>

</div>

`

}

)

function addCart(

name,

price

){

cart.push({

name,

price

})

document

.getElementById(

"count"

)

.innerText=

cart.length

}

function viewCart(){

if(

cart.length===0

){

alert(

"Giỏ hàng trống"

)

return

}

let text=""

let total=0

cart.forEach(

item=>{

text+=

item.name+

" - "+

item.price
.toLocaleString()

+" VNĐ\n"

total+=

item.price

}

)

alert(

text+

"\nTổng tiền: "+

total
.toLocaleString()

+" VNĐ"

)

}

function clearCart(){

cart=[]

document

.getElementById(

"count"

)

.innerText=0

alert(

"Đã xóa giỏ hàng"

)

}

function checkout(){

let name=

document

.getElementById(

"name"

)

.value

let phone=

document

.getElementById(

"phone"

)

.value

let address=

document

.getElementById(

"address"

)

.value

.toLowerCase()

if(

cart.length===0

){

alert(

"Chưa có bánh"

)

return

}

if(

!address
.includes("đà nẵng")

&&

!address
.includes("da nang")

){

alert(

"Chỉ giao nội thành Đà Nẵng"

)

return

}

alert(

"Cảm ơn "+

name+

"\nĐơn hàng đã được ghi nhận"

)

}

</script>

</body>

</html>
